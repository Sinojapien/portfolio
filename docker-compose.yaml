version: "1.0.0"

name: "portfolio"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./servers/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - front-end-portfolio
    networks:
      - app-network

  front-end-portfolio:
    build:
      context: ./
      dockerfile: ./servers/front-end-portfolio/Dockerfile
    expose:
      - "3000" # `ports` expose to host machine, `expose` expose only within networks
    restart: on-failure
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
